<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen · Facturieren</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#6b7280;--line:#e5e7eb;--acc:#c2185b;--head:#c2185b;--err:#b91c1c;--input:#fff}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12151b;--card:#1b2029;--fg:#e6e8ec;--muted:#9aa3b2;--line:#2b323e;--acc:#d63a7a;--head:#7a1240;--err:#f87171;--input:#141820}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);
  font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
header{background:var(--head);color:#fff;padding:16px 20px}
h1{font-size:20px;margin:0}
form{padding:20px}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;margin-bottom:6px}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;background:var(--input);color:var(--fg);padding:9px 10px;border:1px solid var(--line);border-radius:6px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
button{font:inherit;border:0;border-radius:6px;padding:0 16px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.show{background:none;color:var(--muted);padding:8px 0 0;font-size:13px}
.err{color:var(--err);margin:10px 0 0;min-height:1.4em;font-size:14px}
</style>
</head>
<body>
<main>
  <header><h1>Facturieren</h1></header>
  <form id="form">
    <p>Log in om de facturatie te openen. Deze browser onthoudt het 30 dagen.</p>
    <label for="pw">Wachtwoord</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="current-password" autofocus required>
      <button id="go" type="submit">Inloggen</button>
    </div>
    <button class="show" id="show" type="button" aria-pressed="false">Wachtwoord tonen</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
const $ = s => document.querySelector(s);
$("#show").onclick = () => {
  const on = $("#pw").type === "password";
  $("#pw").type = on ? "text" : "password";
  $("#show").textContent = on ? "Wachtwoord verbergen" : "Wachtwoord tonen";
  $("#show").setAttribute("aria-pressed", on);
  $("#pw").focus();
};
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  $("#go").disabled = true; $("#err").textContent = "";
  try {
    const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("#pw").value }) });
    const data = await res.json().catch(() => ({}));
    if (res.ok) { location.replace("/"); return; }
    $("#err").textContent = data.detail || "Inloggen lukte niet. Probeer het opnieuw.";
    $("#pw").select();
  } catch {
    $("#err").textContent = "Geen verbinding met de server.";
  }
  $("#go").disabled = false;
});
</script>
</body>
</html>
