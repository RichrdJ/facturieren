services:
  facturieren:
    build: .
    image: ghcr.io/richrdj/facturieren:latest
    ports:
      - "9898:9898"
    volumes:
      - ./data:/data
    environment:
      # Leeg = geen wachtwoord. Zet dit als de app niet alleen lokaal draait.
      APP_USER: admin
      APP_PASSWORD: ""
    restart: unless-stopped
