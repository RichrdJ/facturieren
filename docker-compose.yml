services:
  facturieren:
    build: .
    image: ghcr.io/richrdj/facturieren:latest
    ports:
      - "9898:9898"
    volumes:
      - ./data:/data
    environment:
      # Wachtwoord voor de app; laat leeg om zonder inloggen te werken.
      APP_PASSWORD: ""
      COOKIE_SECURE: "false"
    restart: unless-stopped
